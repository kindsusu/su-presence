<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="개념 구분: 접근성, 인용, 조직 사실과 평판. 실행 순서나 자동 학습을 뜻하지 않으며 각각 별도 검증한다.">
  <style>
    .bg   { fill: #10201C }
    .pan  { fill: #1A2B28; stroke: #2E4A44; stroke-width: 1 }
    text  { font-family: ui-sans-serif, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Roboto, Arial, sans-serif }
    .name { font-size: 17px; font-weight: 700; fill: #E9F2EF }
    .cad  { font-size: 11.5px; letter-spacing: .06em; fill: #9DB5AE }
    .q    { font-size: 14px; fill: #E9F2EF }
    .ln   { font-size: 12.5px; fill: #9DB5AE }
    .id   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #58BBA6 }
    .num  { font-size: 15px; font-weight: 700; fill: #FFFFFF; text-anchor: middle }
    .note { font-size: 12px; fill: #7E9992 }
    .div  { stroke: #2E4A44; stroke-width: 1 }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="420"/>

  <!-- ③ 각인 -->
  <rect class="pan" x="24" y="20" width="852" height="104" rx="10"/>
  <circle cx="58" cy="60" r="17" fill="#0E6B5C" opacity="0.62"/>
  <text class="num" x="58" y="65">3</text>
  <text class="name" x="86" y="58">각인</text>
  <text class="cad"  x="86" y="80">별도 관측 필요</text>
  <line class="div" x1="286" y1="36" x2="286" y2="108"/>
  <text class="q"  x="310" y="58">검색 없이도 우리를 아는가</text>
  <text class="ln" x="310" y="82"><tspan class="id">llmo</tspan> — 조직 사실의 일관성·출처를 정리한다</text>
  <text class="ln" x="310" y="101"><tspan class="id">reputation</tspan> — 제3자 평판이 우리를 설명한다</text>

  <!-- ② 인용 -->
  <rect class="pan" x="24" y="138" width="852" height="123" rx="10"/>
  <circle cx="58" cy="178" r="17" fill="#0E6B5C" opacity="0.8"/>
  <text class="num" x="58" y="183">2</text>
  <text class="name" x="86" y="176">인용</text>
  <text class="cad"  x="86" y="198">조건을 고정해 관측</text>
  <line class="div" x1="286" y1="154" x2="286" y2="245"/>
  <text class="q"  x="310" y="176">답을 만들 때 우리를 근거로 쓰는가</text>
  <text class="ln" x="310" y="200"><tspan class="id">aeo</tspan> — 답변 박스 (AI Overviews · Copilot)</text>
  <text class="ln" x="310" y="219"><tspan class="id">geo</tspan> — 생성 엔진 (ChatGPT · Gemini · Claude · Perplexity)</text>
  <text class="ln" x="310" y="238"><tspan class="id">naver</tspan> — AI 브리핑 + 네이버 검색</text>

  <!-- ① 도달 -->
  <rect class="pan" x="24" y="275" width="852" height="104" rx="10"/>
  <circle cx="58" cy="315" r="17" fill="#0E6B5C"/>
  <text class="num" x="58" y="320">1</text>
  <text class="name" x="86" y="313">도달</text>
  <text class="cad"  x="86" y="335">명령 실행 시 검사</text>
  <line class="div" x1="286" y1="291" x2="286" y2="363"/>
  <text class="q"  x="310" y="313">크롤러가 읽고 색인할 수 있는가</text>
  <text class="ln" x="310" y="337"><tspan class="id">seo</tspan> — SSR · 사이트맵 · 구조화 데이터</text>
  <text class="ln" x="310" y="356"><tspan class="id">ops/crawlers</tspan> — 봇 정책이 문을 여는가</text>

  <text class="note" x="24" y="402">개념 구분이며 실행 순서가 아니다. 검색 후보 ≠ 실제 인용, 접근 가능 ≠ 색인 ≠ 모델 학습.</text>
</svg>
