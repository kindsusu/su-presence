<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Concepts: accessibility, citations, organization facts and reputation. Not execution stages or automatic training; verify separately.">
  <style>
    .bg   { fill: #10201C }
    .pan  { fill: #1A2B28; stroke: #2E4A44; stroke-width: 1 }
    text  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif }
    .name { font-size: 17px; font-weight: 700; fill: #E9F2EF }
    .cad  { font-size: 11.5px; letter-spacing: .06em; fill: #9DB5AE }
    .q    { font-size: 14px; fill: #E9F2EF }
    .ln   { font-size: 12.5px; fill: #9DB5AE }
    .id   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #58BBA6 }
    .num  { font-size: 15px; font-weight: 700; fill: #FFFFFF; text-anchor: middle }
    .note { font-size: 12px; fill: #7E9992 }
    .div  { stroke: #2E4A44; stroke-width: 1 }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="420"/>

  <!-- layer 3 — recall -->
  <rect class="pan" x="24" y="20" width="852" height="104" rx="10"/>
  <circle cx="58" cy="60" r="17" fill="#0E6B5C" opacity="0.62"/>
  <text class="num" x="58" y="65">3</text>
  <text class="name" x="86" y="58">recall</text>
  <text class="cad"  x="86" y="80">SEPARATE OBSERVATION</text>
  <line class="div" x1="286" y1="36" x2="286" y2="108"/>
  <text class="q"  x="310" y="58">Does the model know us without searching?</text>
  <text class="ln" x="310" y="82"><tspan class="id">llmo</tspan> — organize consistent organization facts and sources</text>
  <text class="ln" x="310" y="101"><tspan class="id">reputation</tspan> — third parties describe us</text>

  <!-- layer 2 — citation -->
  <rect class="pan" x="24" y="138" width="852" height="123" rx="10"/>
  <circle cx="58" cy="178" r="17" fill="#0E6B5C" opacity="0.8"/>
  <text class="num" x="58" y="183">2</text>
  <text class="name" x="86" y="176">citation</text>
  <text class="cad"  x="86" y="198">FIXED CONDITIONS</text>
  <line class="div" x1="286" y1="154" x2="286" y2="245"/>
  <text class="q"  x="310" y="176">Are we the evidence inside the answer?</text>
  <text class="ln" x="310" y="200"><tspan class="id">aeo</tspan> — answer boxes (AI Overviews · Copilot)</text>
  <text class="ln" x="310" y="219"><tspan class="id">geo</tspan> — generative engines (ChatGPT · Gemini · Claude · Perplexity)</text>
  <text class="ln" x="310" y="238"><tspan class="id">naver</tspan> — AI Briefing + Naver search</text>

  <!-- layer 1 — reach -->
  <rect class="pan" x="24" y="275" width="852" height="104" rx="10"/>
  <circle cx="58" cy="315" r="17" fill="#0E6B5C"/>
  <text class="num" x="58" y="320">1</text>
  <text class="name" x="86" y="313">reach</text>
  <text class="cad"  x="86" y="335">ON INVOCATION</text>
  <line class="div" x1="286" y1="291" x2="286" y2="363"/>
  <text class="q"  x="310" y="313">Can crawlers read and index us at all?</text>
  <text class="ln" x="310" y="337"><tspan class="id">seo</tspan> — SSR, sitemap, structured data</text>
  <text class="ln" x="310" y="356"><tspan class="id">ops/crawlers</tspan> — does bot policy open the door?</text>

  <text class="note" x="24" y="402">Concepts, not execution stages. Access ≠ indexing ≠ citations ≠ model training.</text>
</svg>
