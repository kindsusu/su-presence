name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Repository content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python tools/validate.py --root .

  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]

    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      # 의존성 설치 단계가 없다는 것이 이 CI의 주장이다 — 표준 라이브러리만 쓴다.
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Syntax check
        run: python -m py_compile tools/seo_geo.py tools/crawl.py tools/report.py tools/generate.py tools/verify.py tools/measure.py tools/drift.py

      - name: CLI environment check
        run: python tools/seo_geo.py doctor

      - name: Unit + E2E tests
        run: python -m unittest discover tests -v

      - name: audit.sh regression
        shell: bash
        run: bash tools/test_audit.sh
