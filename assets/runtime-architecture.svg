<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="820" viewBox="0 0 1340 820" role="img" aria-label="su-presence 3.0.0 runtime architecture">
<title>su-presence 3.0.0 Runtime Architecture</title>
<desc>Automatic run stages, saved state, explicit human publication and separately invoked measurement. No automatic deployment.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#698398"/></marker></defs>
<rect width="1340" height="820" fill="#f4f7fb"/>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1b3449}.title{font-size:28px;font-weight:700}.label{font-size:19px;font-weight:600}.sub{font-size:14px;fill:#48647c}.edge{font-size:14px;fill:#4a657d}</style>
<text x="40" y="42" class="title">su-presence 3.0.0 — Runtime Architecture</text>
<text x="40" y="69" class="sub">Command-driven automation • durable local state • human review before publication</text>
<path d="M285 155 L510 155" stroke="#698398" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="369.0" y="129.0" width="57.0" height="19" fill="#f4f7fb"/><text x="397.5" y="143" text-anchor="middle" class="edge">invoke</text>
